<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de eventos - Grupo 3</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>
<body>

  <!-- Encabezado: título del panel y tarjeta de ubicación -->
  <header class="encabezado">
    <div>
      <h1>Panel de eventos</h1>
    </div>

    <section class="widget-ubicacion" aria-label="Ubicación actual">
      <h2>Tu ubicación actual</h2>
      <p id="textoUbicacion">Esperando permiso de ubicación...</p>
      <button id="btnUbicacion" type="button">Actualizar ubicación</button>
    </section>
  </header>

  <!-- Cuerpo del dashboard: tres paneles -->
  <main class="dashboard">

    <section class="panel panel-eventos">
      <div class="panel-cabecera">
        <h2>Eventos</h2>
        <span class="contador" id="contadorEventos">0</span>
      </div>
      <!-- Buscador: escribe una palabra y busca esos eventos en Ticketmaster -->
      <form id="formBuscar" class="buscador">
        <input id="inputBuscar" type="search" placeholder="Ej: rock, football, theater" required>
        <button type="submit">Buscar</button>
      </form>
      <!-- Mensajes de carga o error (fuera de la lista para que no se puedan arrastrar) -->
      <p class="estado" id="estadoEventos" role="status">Cargando eventos...</p>
      <ul class="lista" id="eventos"></ul>
    </section>

    <section class="panel panel-interesados">
      <div class="panel-cabecera">
        <h2>Interesados</h2>
        <span class="contador" id="contadorInteresados">0</span>
      </div>
      <p class="estado">Arrastra desde el ⠿ los eventos que te interesan.</p>
      <ul class="lista" id="interesados"></ul>
    </section>

    <aside class="panel panel-grafica">
      <div class="panel-cabecera">
        <h2>Eventos seleccionados</h2>
      </div>
      <canvas id="grafica" width="300" height="240"></canvas>
    </aside>

  </main>

  <script src="ubicacion.js"></script>
  <script src="canvas.js"></script>
  <script src="apiTicket.js"></script>
  <script src="app.js"></script>
</body>
</html>
