<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de eventos - Grupo 3</title>
  <link rel="stylesheet" href="estilos.css">
  <!-- La librería de drag & drop va ANTES de nuestros scripts -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>
<body>

  <!-- Encabezado: título del panel y tarjeta de ubicación -->
  <header class="encabezado">
    <div>
      <h1>Panel de eventos</h1>
    </div>

    <section class="widget-ubicacion" aria-label="Ubicación actual">
      <h2>Tu ubicación actual</h2>
      <p id="textoUbicacion">Esperando permiso de ubicación...</p>
      <button id="btnUbicacion" type="button">Actualizar ubicación</button>
    </section>
  </header>

  <!-- Cuerpo del dashboard: tres paneles -->
  <main class="dashboard">

    <section class="panel panel-eventos">
      <div class="panel-cabecera">
        <h2>Eventos</h2>
        <span class="contador" id="contadorEventos">0</span>
      </div>

      <form id="formBuscar" class="buscador" novalidate>
        <input id="inputBuscar" name="busqueda" type="search"
               placeholder="Ej: rock, football, theater"
               required minlength="3" maxlength="30"
               pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]+"
               aria-describedby="errorBusqueda">
        <button type="submit">Buscar</button>
      </form>
      <p class="error-busqueda" id="errorBusqueda" aria-live="polite"></p>

      <!-- Mensajes de carga o error -->
      <p class="estado" id="estadoEventos" role="status">Cargando eventos...</p>
      <ul class="lista" id="eventos"></ul>
    </section>

    <section class="panel panel-interesados">
      <div class="panel-cabecera">
        <h2>Interesados</h2>
        <span class="contador" id="contadorInteresados">0/7</span>
      </div>
      <p class="estado">Arrastra desde el ⠿ hasta 7 eventos. Se guardan aunque cierres la página.</p>
      <ul class="lista" id="interesados"></ul>
      <button class="boton-secundario" id="btnVaciar" type="button">Vaciar interesados</button>
    </section>

    <aside class="panel panel-grafica">
      <div class="panel-cabecera">
        <h2>Eventos seleccionados</h2>
      </div>
      <canvas id="grafica" width="300" height="240"></canvas>
    </aside>

  </main>

  <script src="config.js"></script>
  <script src="ubicacion.js"></script>
  <script src="canvas.js"></script>
  <script src="apiTicket.js"></script>
  <script src="app.js"></script>
</body>
</html>
